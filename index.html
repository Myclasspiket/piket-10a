/* =========================

========================= */

const initialStudents = [

  ["Damar", "Senin"],
  ["Anna", "Senin"],
  ["Putra", "Senin"],
  ["Aivy", "Senin"],

  ["Rafa", "Selasa"],

  ["Alief", "Selasa"],
  ["Balkis", "Selasa"],
  ["Andi", "Selasa"],
  ["Ziya", "Selasa"],
  ["Asya", "Selasa"],
  ["Nayla", "Selasa"],

  ["Jazil", "Rabu"],
  ["Aaliyah", "Rabu"],
  ["Zaidan", "Rabu"],
  ["Reni", "Rabu"],
  ["Ikram", "Rabu"],
  ["Amira", "Rabu"],
  ["Callista", "Rabu"],

  ["Fahri", "Kamis"],
  ["Naura", "Kamis"],
  ["Yoga", "Kamis"],
  ["Salwa", "Kamis"],
  ["Devan", "Kamis"],
  ["Farras", "Kamis"],
  ["Nur", "Kamis"],

  ["Reski", "Jumat"],

  ["Raffa", "Jumat"],
  ["Syifa", "Jumat"],
  ["Zidan", "Jumat"],
  ["Hani", "Jumat"],
  ["Mia", "Jumat"]

/* =========================
   STORAGE
========================= */

let students = JSON.parse(localStorage.getItem("myclass_students"));

if (!students) {
  students = initialStudents.map((s, i) => ({
    id: Date.now() + i,
    name: s[0],
    className: "X A",
    day: s[1],
    time: "06.30–07.00",
    status: "Belum Piket"
  }));

  saveData();
}

let currentUser =
  JSON.parse(localStorage.getItem("myclass_user")) || null;

let editingId = null;
let deletingId = null;
let selectedDay = "Senin";

/* =========================
   SETTINGS
========================= */

let settings = JSON.parse(
  localStorage.getItem("myclass_settings")
) || {
  className: "X A",
  defaultTime: "06.30–07.00",
  theme: "light",
  notifications: "Aktif",
  reminder: "Aktif"
};

/* =========================
   SAVE DATA
========================= */

function saveData() {
  localStorage.setItem(
    "myclass_students",
    JSON.stringify(students)
  );
}

/* =========================
   TOAST
========================= */

function toast(message) {
  const el = document.getElementById("toast");

  el.textContent = message;
  el.classList.add("show");

  setTimeout(() => {
    el.classList.remove("show");
  }, 2500);
}

/* =========================
   NAVIGATION
========================= */

const navItems = [
  ["home", "🏠", "Beranda"],
  ["schedule", "📅", "Jadwal"],
  ["students", "👥", "Siswa"],
  ["recap", "📊", "Rekap"],
  ["reminder", "🔔", "Pengingat"],
  ["settings", "⚙️", "Pengaturan"]
];

function buildNavigation() {
  const side = document.getElementById("sideNav");
  const bottom = document.getElementById("bottomNav");

  side.innerHTML = "";
  bottom.innerHTML = "";

  navItems.forEach(item => {
    const [id, icon, label] = item;

    const sideBtn = document.createElement("button");
    sideBtn.innerHTML = `${icon} &nbsp; ${label}`;
    sideBtn.onclick = () => showPage(id);

    const bottomBtn = document.createElement("button");
    bottomBtn.innerHTML =
      `<span>${icon}</span>${label}`;
    bottomBtn.onclick = () => showPage(id);

    side.appendChild(sideBtn);
    bottom.appendChild(bottomBtn);
  });

  updateNavigation("home");
}

function showPage(id) {
  document.querySelectorAll(".page").forEach(page => {
    page.classList.remove("active");
  });

  const page = document.getElementById(id);

  if (page) {
    page.classList.add("active");
  }

  updateNavigation(id);

  if (id === "home") renderHome();
  if (id === "schedule") renderSchedule();
  if (id === "students") renderStudents();
  if (id === "recap") renderRecap("Harian");
  if (id === "reminder") renderReminder();
  if (id === "settings") loadSettings();
}

function updateNavigation(activeId) {
  document.querySelectorAll(".nav button").forEach((btn, i) => {
    btn.classList.toggle(
      "active",
      navItems[i][0] === activeId
    );
  });

  document.querySelectorAll(".bottom-nav button").forEach(
    (btn, i) => {
      btn.classList.toggle(
        "active",
        navItems[i][0] === activeId
      );
    }
  );
}

/* =========================
   DATE
========================= */

function updateDate() {
  const now = new Date();

  const text = now.toLocaleDateString("id-ID", {
    weekday: "long",
    day: "numeric",
    month: "long",
    year: "numeric"
  });

  document.getElementById("dateDisplay").textContent = text;
}

/* =========================
   TODAY
========================= */

function getToday() {
  const days = [
    "Minggu",
    "Senin",
    "Selasa",
    "Rabu",
    "Kamis",
    "Jumat",
    "Sabtu"
  ];

  return days[new Date().getDay()];
}

/* =========================
   HOME
========================= */

function renderHome() {
  const today = getToday();

  const todayStudents = students.filter(
    s => s.day === today
  );

  document.getElementById("greeting").textContent =
    `Halo, ${currentUser && currentUser.role === "student"
      ? currentUser.name
      : "Siswa"} ${settings.className}! 👋`;

  const sudah = todayStudents.filter(
    s => s.status === "Sudah Piket"
  ).length;

  const belum = todayStudents.filter(
    s => s.status === "Belum Piket"
  ).length;

  document.getElementById("homeStats").innerHTML = `
    <div class="card stat">
      <div class="stat-icon">👥</div>
      <div>
        <div class="stat-number">${todayStudents.length}</div>
        <div class="muted">Siswa Terjadwal</div>
      </div>
    </div>

    <div class="card stat">
      <div class="stat-icon">✅</div>
      <div>
        <div class="stat-number">${sudah}</div>
        <div class="muted">Sudah Piket</div>
      </div>
    </div>

    <div class="card stat">
      <div class="stat-icon">⏳</div>
      <div>
        <div class="stat-number">${belum}</div>
        <div class="muted">Belum Piket</div>
      </div>
    </div>
  `;

  const container =
    document.getElementById("todayStudents");

  if (!todayStudents.length) {
    container.innerHTML = `
      <div class="card empty">
        📭 Tidak ada jadwal piket hari ini.
      </div>
    `;
    return;
  }

  container.innerHTML =
    todayStudents.map(studentCard).join("");
}

/* =========================
   STUDENT CARD
========================= */

function studentCard(student) {
  let statusClass = "status-belum";

  if (student.status === "Sudah Piket") {
    statusClass = "status-sudah";
  }

  if (student.status === "Tidak Melaksanakan") {
    statusClass = "status-tidak";
  }

  const icon =
    student.status === "Sudah Piket"
      ? "🟢"
      : student.status === "Tidak Melaksanakan"
      ? "🔴"
      : "🟡";

  return `
    <div class="student-card">
      <div class="student-name">
        👤 ${escapeHTML(student.name)}
      </div>

      <span class="day-badge ${student.day}">
        📅 ${student.day}
      </span>

      <div class="muted">
        ⏰ ${student.time}
      </div>

      <div class="status ${statusClass}">
        ${icon} ${student.status}
      </div>

      ${
        currentUser?.role === "student" &&
        currentUser.name.toLowerCase() ===
          student.name.toLowerCase()
          ? `
            <button
              class="primary-btn"
              style="margin-top:12px;width:100%;"
              onclick="markDone(${student.id})"
            >
              ✅ Selesai Piket
            </button>
          `
          : ""
      }
    </div>
  `;
}

/* =========================
   MARK DONE
========================= */

function markDone(id) {
  const student = students.find(s => s.id === id);

  if (!student) return;

  student.status = "Sudah Piket";

  saveData();

  toast("✅ Piket berhasil dicatat!");

  renderHome();
  renderSchedule();
  renderStudents();
}

/* =========================
   SCHEDULE
========================= */

function renderSchedule() {
  const days = [
    "Senin",
    "Selasa",
    "Rabu",
    "Kamis",
    "Jumat"
  ];

  const tabs = document.getElementById("dayTabs");

  tabs.innerHTML = days.map(day => `
    <button
      class="${selectedDay === day ? "active" : ""}"
      onclick="selectDay('${day}')"
    >
      ${day}
    </button>
  `).join("");

  const list = students.filter(
    s => s.day === selectedDay
  );

  const container =
    document.getElementById("scheduleStudents");

  if (!list.length) {
    container.innerHTML = `
      <div class="card empty">
        📭 Belum ada siswa pada hari ${selectedDay}.
      </div>
    `;
    return;
  }

  container.innerHTML =
    list.map(studentCard).join("");
}

function selectDay(day) {
  selectedDay = day;
  renderSchedule();
}

/* =========================
   STUDENTS TABLE
========================= */

function renderStudents() {
  const search =
    document.getElementById("searchInput")
      ?.value.toLowerCase() || "";

  const filter =
    document.getElementById("filterDay")
      ?.value || "";

  let list = students.filter(student => {
    const matchName =
      student.name.toLowerCase().includes(search);

    const matchDay =
      !filter || student.day === filter;

    return matchName && matchDay;
  });

  const table =
    document.getElementById("studentTable");

  if (!list.length) {
    table.innerHTML = `
      <tr>
        <td colspan="7">
          <div class="empty">
            📭 Siswa tidak ditemukan.
          </div>
        </td>
      </tr>
    `;
    return;
  }

  table.innerHTML = list.map((student, index) => `
    <tr>
      <td>${index + 1}</td>

      <td>
        <b>${escapeHTML(student.name)}</b>
      </td>

      <td>${escapeHTML(student.className)}</td>

      <td>
        <span class="day-badge ${student.day}">
          ${student.day}
        </span>
      </td>

      <td>${student.time}</td>

      <td>${student.status}</td>

      <td>
        ${
          currentUser?.role === "admin"
            ? `
              <button
                class="action-btn"
                onclick="openStudentModal(${student.id})"
              >
                ✏️
              </button>

              <button
                class="action-btn delete-btn"
                onclick="openDeleteModal(${student.id})"
              >
                🗑️
              </button>
            `
            : "-"
        }
      </td>
    </tr>
  `).join("");
}

/* =========================
   STUDENT MODAL
========================= */

function openStudentModal(id = null) {
  if (currentUser?.role !== "admin") {
    toast("🔒 Hanya admin yang dapat mengubah data.");
    return;
  }

  editingId = id;

  const modal =
    document.getElementById("studentModal");

  document.getElementById("modalTitle").textContent =
    id ? "✏️ Edit Siswa" : "＋ Tambah Siswa";

  if (id) {
    const student =
      students.find(s => s.id === id);

    if (!student) return;

    document.getElementById("studentName").value =
      student.name;

    document.getElementById("studentClass").value =
      student.className;

    document.getElementById("studentDay").value =
      student.day;

    document.getElementById("studentTime").value =
      student.time;

    document.getElementById("studentStatus").value =
      student.status;

  } else {
    document.getElementById("studentName").value = "";
    document.getElementById("studentClass").value =
      settings.className;
    document.getElementById("studentDay").value =
      "Senin";
    document.getElementById("studentTime").value =
      settings.defaultTime;
    document.getElementById("studentStatus").value =
      "Belum Piket";
  }

  modal.classList.add("show");
}

function closeStudentModal() {
  document
    .getElementById("studentModal")
    .classList.remove("show");

  editingId = null;
}

function saveStudent() {
  if (currentUser?.role !== "admin") {
    toast("🔒 Hanya admin yang dapat mengubah data.");
    return;
  }

  const name =
    document.getElementById("studentName").value.trim();

  const className =
    document.getElementById("studentClass").value.trim();

  const day =
    document.getElementById("studentDay").value;

  const time =
    document.getElementById("studentTime").value.trim();

  const status =
    document.getElementById("studentStatus").value;

  if (!name) {
    toast("⚠️ Nama siswa wajib diisi.");
    return;
  }

  if (editingId) {
    const student =
      students.find(s => s.id === editingId);

    student.name = name;
    student.className = className;
    student.day = day;
    student.time = time;
    student.status = status;

    toast("✅ Perubahan berhasil disimpan!");

  } else {
    students.push({
      id: Date.now(),
      name,
      className,
      day,
      time,
      status
    });

    toast("✅ Siswa berhasil ditambahkan!");
  }

  saveData();

  closeStudentModal();

  renderHome();
  renderSchedule();
  renderStudents();
}

/* =========================
   DELETE
========================= */

function openDeleteModal(id) {
  if (currentUser?.role !== "admin") {
    toast("🔒 Hanya admin yang dapat menghapus siswa.");
    return;
  }

  deletingId = id;

  document
    .getElementById("deleteModal")
    .classList.add("show");
}

function closeDeleteModal() {
  deletingId = null;

  document
    .getElementById("deleteModal")
    .classList.remove("show");
}

function deleteStudent() {
  if (!deletingId) return;

  students = students.filter(
    s => s.id !== deletingId
  );

  saveData();

  closeDeleteModal();

  toast("🗑️ Siswa berhasil dihapus.");

  renderHome();
  renderSchedule();
  renderStudents();
}

/* =========================
   RECAP
========================= */

function renderRecap(type = "Harian", button = null) {
  document
    .querySelectorAll("#recap .tabs button")
    .forEach(btn => btn.classList.remove("active"));

  if (button) {
    button.classList.add("active");
  }

  const total = students.length;

  const sudah = students.filter(
    s => s.status === "Sudah Piket"
  ).length;

  const belum = students.filter(
    s => s.status === "Belum Piket"
  ).length;

  const tidak = students.filter(
    s => s.status === "Tidak Melaksanakan"
  ).length;

  document.getElementById("recapStats").innerHTML = `
    <div class="card stat">
      <div class="stat-icon">📋</div>
      <div>
        <div class="stat-number">${total}</div>
        <div class="muted">Total Siswa</div>
      </div>
    </div>

    <div class="card stat">
      <div class="stat-icon">✅</div>
      <div>
        <div class="stat-number">${sudah}</div>
        <div class="muted">Sudah Piket</div>
      </div>
    </div>

    <div class="card stat">
      <div class="stat-icon">⏳</div>
      <div>
        <div class="stat-number">${belum}</div>
        <div class="muted">Belum Piket</div>
      </div>
    </div>
  `;

  document.getElementById("recapContent").innerHTML = `
    <div class="card">

      <h3>📊 Rekap ${type}</h3>

      <br>

      <p>
        🟢 Sudah Piket:
        <b>${sudah}</b>
      </p>

      <br>

      <p>
        🟡 Belum Piket:
        <b>${belum}</b>
      </p>

      <br>

      <p>
        🔴 Tidak Melaksanakan:
        <b>${tidak}</b>
      </p>

      <br>

      <h3>📈 Persentase Pelaksanaan</h3>

      <br>

      <div class="progress">
        <span style="width:${
          total ? (sudah / total) * 100 : 0
        }%"></span>
      </div>

      <br>

      <b>
        ${
          total
            ? Math.round((sudah / total) * 100)
            : 0
        }%
      </b>

    </div>
  `;
}

/* =========================
   REMINDER
========================= */

function renderReminder() {
  const tomorrowIndex =
    (new Date().getDay() + 1) % 7;

  const days = [
    "Minggu",
    "Senin",
    "Selasa",
    "Rabu",
    "Kamis",
    "Jumat",
    "Sabtu"
  ];

  const tomorrow = days[tomorrowIndex];

  const list = students.filter(
    s => s.day === tomorrow
  );

  const active =
    settings.reminder === "Aktif";

  document.getElementById("reminderContent").innerHTML = `
    <h2>🔔 Jadwal Piket Besok</h2>

    <br>

    ${
      list.length
        ? `<p>
            ${list.map(s => escapeHTML(s.name)).join(", ")}
            mendapat jadwal piket besok.
          </p>`
        : `<p class="muted">
            Tidak ada jadwal piket besok.
          </p>`
    }

    <br>

    <p>⏰ Waktu Pengingat: <b>06.45</b></p>

    <p style="margin-top:8px">
      📅 Hari: Senin–Jumat
    </p>

    <br>

    <p>
      ${
        active
          ? "🟢 Pengingat Aktif"
          : "🔴 Pengingat Nonaktif"
      }
    </p>

    <br>

    <button
      class="primary-btn"
      onclick="toggleReminder()"
    >
      ${
        active
          ? "🔕 Nonaktifkan Pengingat"
          : "🔔 Aktifkan Pengingat"
      }
    </button>
  `;
}

function toggleReminder() {
  settings.reminder =
    settings.reminder === "Aktif"
      ? "Nonaktif"
      : "Aktif";

  localStorage.setItem(
    "myclass_settings",
    JSON.stringify(settings)
  );

  renderReminder();

  toast(
    settings.reminder === "Aktif"
      ? "🔔 Pengingat diaktifkan!"
      : "🔕 Pengingat dinonaktifkan."
  );
}

/* =========================
   SETTINGS
========================= */

function loadSettings() {
  document.getElementById("className").value =
    settings.className;

  document.getElementById("defaultTime").value =
    settings.defaultTime;

  document.getElementById("theme").value =
    settings.theme;

  document.getElementById("notifications").value =
    settings.notifications;

  document.getElementById("reminderSetting").value =
    settings.reminder;

  applyTheme();
}

function saveSettings() {
  settings.className =
    document.getElementById("className").value;

  settings.defaultTime =
    document.getElementById("defaultTime").value;

  settings.theme =
    document.getElementById("theme").value;

  settings.notifications =
    document.getElementById("notifications").value;

  settings.reminder =
    document.getElementById("reminderSetting").value;

  localStorage.setItem(
    "myclass_settings",
    JSON.stringify(settings)
  );

  applyTheme();

  renderHome();
  renderSchedule();
  renderReminder();

  toast("✅ Pengaturan berhasil disimpan!");
}

function applyTheme() {
  document.body.classList.toggle(
    "dark",
    settings.theme === "dark"
  );
}

/* =========================
   LOGIN
========================= */

/*
   A=1
   B=2
   ...
   Z=26

   Contoh:
   Zidan
   Z=26
   I=9
   D=4
   A=1
   N=14

   Password:
   269114
*/

function nameToPassword(name) {
  return name
    .toUpperCase()
    .replace(/[^A-Z]/g, "")
    .split("")
    .map(char =>
      char.charCodeAt(0) - 64
    )
    .join("");
}

function login() {
  const username =
    document.getElementById("username")
      .value.trim();

  const password =
    document.getElementById("password")
      .value.trim();

  if (
    username.toLowerCase() === "admin" &&
    password === "admin123"
  ) {
    currentUser = {
      role: "admin",
      name: "Admin"
    };

    localStorage.setItem(
      "myclass_user",
      JSON.stringify(currentUser)
    );

    closeLogin();

    updateUserUI();

    toast("✅ Login sebagai Admin berhasil!");

    return;
  }

  const student = students.find(
    s =>
      s.name.toLowerCase() ===
        username.toLowerCase() &&
      nameToPassword(s.name) === password
  );

  if (!student) {
    toast("❌ Username atau password salah!");
    return;
  }

  currentUser = {
    role: "student",
    name: student.name,
    id: student.id
  };

  localStorage.setItem(
    "myclass_user",
    JSON.stringify(currentUser)
  );

  closeLogin();

  updateUserUI();

  toast(`✅ Selamat datang, ${student.name}!`);
}

function updateUserUI() {
  const chip =
    document.getElementById("userChip");

  const button =
    document.getElementById("loginButton");

  if (currentUser) {
    chip.textContent =
      currentUser.role === "admin"
        ? "👑 Admin"
        : `👤 ${currentUser.name}`;

    button.textContent = "Logout";
    button.onclick = logout;

  } else {
    chip.textContent = "👤 Tamu";
    button.textContent = "Login";
    button.onclick = openLogin;
  }
}

function logout() {
  currentUser = null;
